<!DOCTYPE html>
<html>
<head>
  <title>YouTube Time Warning Settings</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .setting-label {
      font-size: 14px;
      color: #333;
    }
    .time-input {
      width: 60px;
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .confidence-input {
      width: 60px;
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="setting-row">
      <span class="setting-label">Enable Warning</span>
      <label class="switch">
        <input type="checkbox" id="enableWarning" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <span class="setting-label">Warning Time (minutes)</span>
      <input type="number" id="warningTime" class="time-input" min="1" max="120" value="15">
    </div>
    <div class="setting-row">
      <span class="setting-label">Confidence Threshold</span>
      <input type="number" id="confidenceThreshold" class="confidence-input" min="0" max="1" step="0.1" value="0.4">
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
